<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards Page</title>
    <link rel="stylesheet" href="cards.css">
</head>
<body>
    
     <main id="playing-cards">
       <!-- 2 of Spades -->
        <div class="card">
             <div class="left">
                <div>2</div>
                <div>♠</div>
            </div>
       
             <div class="middle">
                <div>♠</div>
                <div class="flipped">♠</div>
            </div>
     
             <div class="right">
                <div class="flipped">♠</div>
                <div class="flipped">2</div>
            </div>
            </div>
            <!-- Jack of Spades -->
                    <div class="card">
             <div class="left">
                <div>J</div>
                <div>♠</div>
            </div>

             <div class="right">
                <div class="flipped">♠</div>
                <div class="flipped">J</div>
            </div>
            </div>

            <!-- Queen of Spades -->
            <div class="card">
             <div class="left">
                <div>Q</div>
                <div>♠</div>
            </div>

             <div class="right">
                <div class="flipped">♠</div>
                <div class="flipped">Q</div>
            </div>
            </div>
            <!-- King of Spades-->
            <div class="card">
             <div class="left">
                <div>K</div>
                <div>♠</div>
            </div>

             <div class="right">
                <div class="flipped">♠</div>
                <div class="flipped">K</div>
            </div>
            </div>
            <!-- Ace of Spades -->
             <div class="card">
              <div class="left">
                <div>A</div>
                <div>♠</div>
            </div>

             <div class="middle">
                <div>♠</div>
            </div>
    
             <div class="right">
                <div class="flipped">♠</div>
                <div class="flipped">A</div>
            </div>
       </div>
     </main>

</body>
</html>
